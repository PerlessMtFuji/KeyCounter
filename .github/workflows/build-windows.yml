name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/release/bundle"
          $artifacts = Get-ChildItem -Path $bundleRoot -Recurse -Include *.msi,*.exe
          $artifacts | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $hash, $_.Name
          } | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: keycounter-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
