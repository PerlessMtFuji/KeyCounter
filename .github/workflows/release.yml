name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            args: --target x86_64-pc-windows-msvc
          - os: macos-latest
            target: macos-aarch64
            args: --target aarch64-apple-darwin
          - os: macos-13
            target: macos-x64
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            target: linux-x64
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || matrix.os == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - run: npm ci

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KeyCounter ${{ github.ref_name }}
          releaseBody: |
            ## KeyCounter ${{ github.ref_name }}

            **Unsigned build.** See [docs/antivirus.md](https://github.com/${{ github.repository }}/blob/main/docs/antivirus.md) for how to bypass SmartScreen / Defender / Gatekeeper warnings on first run.

            ### Verify the binary
            SHA-256 hashes of every artifact are published as `SHA256SUMS.txt` on this release. Compare with `sha256sum <file>` (Linux/macOS) or `Get-FileHash <file>` (PowerShell).

            ### What's new
            See commit log for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: SHA-256 checksums
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets, compute and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "$workdir"
          gh release download "$TAG" --repo "$REPO" --pattern '*'
          # exclude an existing checksum file in case of re-runs
          rm -f SHA256SUMS.txt
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber
